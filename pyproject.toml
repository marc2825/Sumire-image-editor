[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "sumire-image"
version = "1.5.0"
description = "Offline image redaction and metadata removal for Windows"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["PySide6-Essentials>=6.8,<7", "Pillow>=11,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "pyinstaller>=6.10,<7"]

[project.gui-scripts]
sumire = "sumire.__main__:main"

[tool.setuptools.packages.find]
include = ["sumire*"]

[tool.setuptools.package-data]
sumire = ["help_docs/*.md", "help_docs/*/*.md", "locales/*.json", "fonts/*.otf", "fonts/OFL.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
target-version = "py312"
line-length = 160

[tool.ruff.lint]
# Mistakes rather than style: undefined or unused names, syntax errors.
select = ["F", "E9"]

[tool.ruff.lint.per-file-ignores]
# Tests import pytest fixtures by name and take them as parameters.
"tests/*" = ["F401", "F811"]

[tool.mypy]
python_version = "3.12"
files = ["sumire"]
# PySide6 and Pillow are checked where they have type information; untyped functions are not checked inside.
ignore_missing_imports = true
follow_imports = "silent"
