# Runs the test suite on Windows and Linux for every push and pull request.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Fixed images: "-latest" moves to a new OS version on its own schedule.
        os: [windows-2025, ubuntu-24.04]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # The same Python as the published Windows build.
          python-version: "3.12.10"
      - name: Qt libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
      - name: Install the pinned packages
        run: python -m pip install --disable-pip-version-check -r scripts/windows-build-requirements.txt
      - name: Translations are complete
        run: python -m scripts.i18n_check
      - name: Nothing private or unexpected would be published
        run: python -m scripts.export_public --audit --destination .
      - name: Lint and types (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m pip install --disable-pip-version-check -r scripts/ci-requirements.txt
          python -m ruff check sumire scripts tests run_sumire.py
          python -m mypy
      - name: Tests with coverage (Linux)
        if: runner.os == 'Linux'
        run: python -m pytest -q -p no:cacheprovider --cov=sumire --cov-report=term:skip-covered
      - name: Tests (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest -q -p no:cacheprovider
